<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Sign in — Auto-Blox</title>
<!-- Deliberately self-contained: this page is served to UNAUTHENTICATED
     clients, so it loads no other asset. The server writes the theme in use
     into the THEME comment below as custom properties: colours, fonts, radii. -->
<style>
  /*THEME*/
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--surface-000); color:var(--ink);
    font-family:var(--font-ui);
    font-size:13px; line-height:19px; padding:16px;
  }
  .card {
    width:100%; max-width:380px; background:var(--surface-100);
    border:1px solid var(--hairline); border-radius:var(--radius-md); padding:24px;
  }
  h1 {
    margin:0 0 4px; font-size:20px; line-height:24px; font-weight:500;
    font-family:var(--font-mono);
  }
  .sub { margin:0 0 24px; color:var(--ink-muted); font-size:13px; }
  label {
    display:block; margin-bottom:4px; font-size:11px; line-height:14px; font-weight:500;
    letter-spacing:.06em; text-transform:uppercase; color:var(--ink-muted);
  }
  input {
    width:100%; background:var(--surface-300); color:var(--ink);
    border:1px solid var(--hairline-strong); border-radius:var(--radius-sm);
    font-family:var(--font-mono); font-size:14px;
    padding:10px 8px; min-height:44px;
  }
  input:focus-visible, button:focus-visible { outline:2px solid var(--focus-ring); outline-offset:2px; }
  button {
    width:100%; margin-top:16px; min-height:44px; cursor:pointer;
    background:var(--signal); color:var(--on-signal);
    border:1px solid var(--signal); border-radius:var(--radius-sm);
    font-family:inherit; font-size:14px; font-weight:500;
  }
  .help {
    margin-top:24px; padding-top:16px; border-top:1px solid var(--hairline);
    color:var(--ink-faint); font-size:11px; line-height:16px;
  }
  code {
    font-family:var(--font-mono);
    color:var(--ink-muted); word-break:break-all;
  }
  .err { display:none; margin-top:12px; color:var(--critical); font-size:12px; }
  .err.on { display:block; }
</style>
</head>
<body>
<main class="card">
  <p class="sub">Auto-Blox</p>
  <h1 id="host">auto-blox</h1>
  <p class="sub">This console is token protected. Paste the token once — this
     browser will remember it for a year.</p>
  <form id="f">
    <label for="t">Access token</label>
    <input id="t" name="t" type="text" autocomplete="off" autocapitalize="off"
           autocorrect="off" spellcheck="false" inputmode="text"
           placeholder="paste token here" required>
    <button type="submit">Open console</button>
    <p class="err" id="err">That token was not accepted.</p>
  </form>
  <p class="help">
    Find it on the board with:<br>
    <code>cat ~/.config/auto-blox/token</code>
  </p>
</main>
<script>
  document.getElementById("host").textContent = location.hostname;
  if (/[?&]bad=1\b/.test(location.search)) document.getElementById("err").classList.add("on");
  document.getElementById("f").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var v = document.getElementById("t").value.trim();
    if (!v) return;
    // Reuse the existing query-string path: a correct token sets the cookie.
    location.href = "/?t=" + encodeURIComponent(v);
  });
</script>
</body>
</html>
